<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prozent- und Zinsrechnung Trainer</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d9e3f0;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --hint: #92400e;
      --hint-bg: #fef3c7;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      border-radius: 26px;
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      font-size: 1.02rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .panel h2,
    .panel h3 {
      margin-top: 0;
    }

    .topic-list {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .topic-btn,
    .btn {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .topic-btn:hover,
    .btn:hover { transform: translateY(-1px); }
    .topic-btn:active,
    .btn:active { transform: translateY(0); }

    .topic-btn {
      text-align: left;
      padding: 13px 14px;
      background: #eef2ff;
      color: #1e3a8a;
    }

    .topic-btn.active {
      background: var(--accent);
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 16px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      transition: width 0.3s ease;
    }

    .formula {
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .main-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      gap: 8px;
      background: #eff6ff;
      padding: 6px;
      border-radius: 14px;
    }

    .btn {
      padding: 11px 15px;
      background: var(--accent);
      color: white;
    }

    .btn.secondary {
      background: #e5edff;
      color: #1e3a8a;
    }

    .btn.ghost {
      background: #eef2f7;
      color: #334155;
    }

    .btn.active {
      outline: 3px solid #bfdbfe;
    }

    .exercise-card {
      background: var(--surface-soft);
      border: 1px solid #dbeafe;
      border-radius: 22px;
      padding: 24px;
    }

    .task-meta {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .task-text {
      font-size: clamp(1.15rem, 2.4vw, 1.5rem);
      font-weight: 700;
      margin-bottom: 22px;
    }

    .answer-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    input[type="number"] {
      width: min(280px, 100%);
      padding: 14px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      background: white;
    }

    .unit {
      color: var(--muted);
      font-weight: 700;
      font-size: 1rem;
    }

    .primary-actions,
    .helper-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary-actions { margin-bottom: 10px; }

    .feedback,
    .hint,
    .solution,
    .purpose-box {
      display: none;
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
    }

    .feedback.good {
      display: block;
      background: var(--ok-bg);
      color: var(--ok);
    }

    .feedback.bad {
      display: block;
      background: var(--bad-bg);
      color: var(--bad);
    }

    .hint.show,
    .solution.show,
    .purpose-box.show {
      display: block;
    }

    .hint.show,
    .solution.show {
      background: var(--hint-bg);
      color: var(--hint);
    }

    .purpose-box.show {
      background: #eff6ff;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
    }

    .purpose-box ul {
      margin: 10px 0 0 20px;
      padding: 0;
    }

    .purpose-box li + li {
      margin-top: 6px;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 14px;
    }

    details summary {
      cursor: pointer;
      font-weight: 700;
      color: #1e3a8a;
    }

    details p {
      color: var(--muted);
      margin-bottom: 0;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .wrap {
        padding: 14px;
      }

      .exercise-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Prozent- und Zinsrechnung</h1>
      
    </section>

    <div class="layout">
      <aside class="panel">
        <h2>Themen</h2>
        <div class="topic-list" id="topicButtons"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Punkte</div>
            <div class="stat-value" id="scoreBadge">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Serie</div>
            <div class="stat-value" id="streakBadge">0</div>
          </div>
        </div>

        <div class="stat" style="margin-bottom:12px;">
          <div class="stat-label">Aktuelles Thema</div>
          <div class="stat-value" id="levelBadge" style="font-size:1.05rem;">Prozentwert</div>
        </div>

        <div class="progress" aria-label="Lernfortschritt">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="formula" id="formulaBox"></div>

        <details>
          <summary>Was ist hier wichtig?</summary>
          <p id="topicSummary"></p>
        </details>
      </aside>

      <main class="panel">
        <div class="main-top">
          <h2 style="margin:0;">Übungsfläche</h2>
          <div class="mode-switch">
            <button class="btn secondary active" id="normalModeBtn">Üben</button>
            <button class="btn secondary" id="testModeBtn">Test</button>
          </div>
        </div>

        <section class="exercise-card">
          <div class="task-meta" id="taskLabel">Basisaufgabe</div>
          <div class="task-text" id="taskText">Lade Aufgabe …</div>

          <div class="answer-box">
            <input id="answerInput" type="number" step="0.01" placeholder="Antwort eingeben" />
            <div class="unit" id="unitLabel"></div>
          </div>

          <div class="primary-actions">
            <button class="btn" id="checkBtn">Prüfen</button>
            <button class="btn secondary" id="nextBtn">Weiter</button>
          </div>

          <div class="helper-actions">
            <button class="btn ghost" id="hintBtn">Hilfe</button>
            <button class="btn ghost" id="solutionBtn">Zeig Lösung</button>
            <button class="btn ghost" id="purposeBtn">Wozu brauche ich das?</button>
            <button class="btn ghost" id="resetBtn">Neu starten</button>
          </div>

          <div class="feedback" id="feedbackBox"></div>
          <div class="hint" id="hintBox"></div>
          <div class="solution" id="solutionBox"></div>
          <div class="purpose-box" id="purposeBox"></div>
        </section>

        <p class="small-note">Hilfe: Überlege zuerst immer, ob nach Teil, Ganzem oder Prozentsatz gefragt wird.</p>
      </main>
    </div>
  </div>

  <script>
    const topics = [
      {
        key: 'prozentwert',
        title: '1. Prozentwert',
        short: 'Prozentwert',
        formula: 'W = G · p / 100',
        summary: 'Du suchst einen Teil von etwas.',
        purpose: {
          title: 'Wozu brauche ich das?',
          points: [
            'Rabatte berechnen.',
            'Anteile verstehen.',
            'Teil von etwas berechnen.'
          ]
        },
        generator: generateProzentwert
      },
      {
        key: 'grundwert',
        title: '2. Grundwert',
        short: 'Grundwert',
        formula: 'G = W · 100 / p',
        summary: 'Du suchst das Ganze.',
        purpose: {
          title: 'Wozu brauche ich das?',
          points: [
            'Alter Preis berechnen.',
            'Gesamtzahl finden.',
            'Vom Teil zurück rechnen.'
          ]
        },
        generator: generateGrundwert
      },
      {
        key: 'prozentsatz',
        title: '3. Prozentsatz',
        short: 'Prozent',
        formula: 'p = W / G · 100',
        summary: 'Du vergleichst Teil und Ganzes.',
        purpose: {
          title: 'Wozu brauche ich das?',
          points: [
            'Vergleichen.',
            'Preisänderungen verstehen.',
            'Prozent lesen.'
          ]
        },
        generator: generateProzentsatz
      },
      {
        key: 'zins',
        title: '4. Zinsen',
        short: 'Zinsen',
        formula: 'Z = K · p / 100',
        summary: 'Geld wird mehr.',
        purpose: {
          title: 'Wozu brauche ich das?',
          points: [
            'Sparen verstehen.',
            'Kredite verstehen.',
            'Geld wächst.'
          ]
        },
        generator: generateZins
      }
    ];

    function renderType(type){
      if(type==='teil'){
        return `
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="display:grid;grid-template-columns:repeat(3,12px);gap:2px;">
            <div style="width:12px;height:12px;background:#22c55e"></div>
            ${Array(8).fill('<div style="width:12px;height:12px;background:#e5e7eb"></div>').join('')}
          </div>
          <span>🧩 W</span>
        </div>`
      }

      if(type==='ganz'){
        return `
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="display:grid;grid-template-columns:repeat(3,12px);gap:2px;">
            ${Array(9).fill('<div style="width:12px;height:12px;background:#3b82f6"></div>').join('')}
          </div>
          <span>🟦 G</span>
        </div>`
      }

      return `
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="display:grid;grid-template-columns:repeat(3,12px);gap:2px;">
          ${Array(9).fill('<div style="width:12px;height:12px;background:#e5e7eb"></div>').join('')}
        </div>
        <span>📊 p</span>
      </div>`
    },
      ganz: {
        html: `
        <div style="display:flex;align-items:center;gap:10px;">
        <div style="display:grid;grid-template-columns:repeat(3,12px);gap:2px;">
          ${Array(9).fill('<div style="width:12px;height:12px;background:#3b82f6"></div>').join('')}
        </div>
        <span>🟦 G</span>
        </div>`
      },
      prozent: {
        html: `
        <div style="display:flex;align-items:center;gap:10px;">
        <div style="display:grid;grid-template-columns:repeat(3,12px);gap:2px;">
          ${Array(9).fill('<div style="width:12px;height:12px;background:#e5e7eb"></div>').join('')}
        </div>
        <span>📊 p</span>
        </div>`
      }
    },
      ganz: { icon: '🟦', text: 'Ganzes' },
      prozent: { icon: '📊', text: 'Prozent' }
    }

    let difficulty = 0;
    let solved = 0;

    let currentTopicIndex = 0;
    let currentTask = null;
    let score = 0;
    let streak = 0;

    const topicButtons = document.getElementById('topicButtons');
    const levelBadge = document.getElementById('levelBadge');
    const scoreBadge = document.getElementById('scoreBadge');
    const streakBadge = document.getElementById('streakBadge');
    const progressBar = document.getElementById('progressBar');
    const formulaBox = document.getElementById('formulaBox');
    const topicSummary = document.getElementById('topicSummary');
    const taskLabel = document.getElementById('taskLabel');
    const taskText = document.getElementById('taskText');
    const taskType = document.getElementById('taskType');
    const unitLabel = document.getElementById('unitLabel');
    const answerInput = document.getElementById('answerInput');
    const feedbackBox = document.getElementById('feedbackBox');
    const hintBox = document.getElementById('hintBox');
    const solutionBox = document.getElementById('solutionBox');
    const purposeBox = document.getElementById('purposeBox');

    function renderSidebar(){
      const topic = topics[currentTopicIndex];
      levelBadge.textContent = topic.short;
      formulaBox.textContent = topic.formula;
      topicSummary.textContent = topic.summary;

      topicButtons.innerHTML='';
      topics.forEach((t,i)=>{
        const b=document.createElement('button');
        b.className='topic-btn'+(i===currentTopicIndex?' active':'');
        b.textContent=t.title;
        b.onclick=()=>{
          currentTopicIndex=i;
          difficulty=0;
          solved=0;
          renderSidebar();
          newTask();
        }
        topicButtons.appendChild(b);
      })
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function round2(n) {
      return Math.round(n * 100) / 100;
    }

    function newTask() {
      if (solved > 4) difficulty = 1;
      if (solved > 8) difficulty = 2;

      const topic = topics[currentTopicIndex];
      currentTask = topic.generator();

      taskText.textContent = currentTask.text;
      taskLabel.textContent = currentTask.label;

      const type = typeConfig[currentTask.type];
      taskType.innerHTML = renderType(currentTask.type);

      unitLabel.textContent = currentTask.unit || '';

      answerInput.value = '';
    }

    function checkAnswer() {
      const val = Number(answerInput.value);
      if (Math.abs(val - currentTask.answer) < 0.01) {
        score++;
        streak++;
        solved++;
        feedbackBox.className = 'feedback good';
        feedbackBox.textContent = 'Richtig';
      } else {
        streak = 0;
        feedbackBox.className = 'feedback bad';
        feedbackBox.textContent = 'Nicht richtig';
      }

      scoreBadge.textContent = score;
      streakBadge.textContent = streak;
    }

    function generateProzentwert() {
      if (difficulty === 0) {
        const G = [20,40,50,80,100][randInt(0,4)];
        const p = [10,25,50][randInt(0,2)];
        return {
          type:'teil',
          label:'Kopf',
          text:`${p}% von ${G}`,
          answer: round2(G*p/100)
        }
      }

      if (difficulty === 1) {
        const G = randInt(20,200);
        const p = randInt(5,50);
        return {
          type:'teil',
          label:'Einfach',
          text:`${p}% von ${G}`,
          answer: round2(G*p/100)
        }
      }

      const G = randInt(50,400);
      const p = randInt(3,37);
      return {
        type:'teil',
        label:'Text',
        text:`Berechne ${p}% von ${G}`,
        answer: round2(G*p/100)
      }
    }

    function generateGrundwert() {
      const G = [40,50,80,100][randInt(0,3)];
      const p = [10,20,25,50][randInt(0,3)];
      const W = round2(G*p/100);
      return {
        type:'ganz',
        label:'Kopf',
        text:`${W} sind ${p}% von ?`,
        answer:G
      }
    }

    function generateProzentsatz() {
      const G = [40,50,80,100][randInt(0,3)];
      const p = [10,20,25,50][randInt(0,3)];
      const W = round2(G*p/100);
      return {
        type:'prozent',
        label:'Kopf',
        text:`${W} von ${G} = ? %`,
        answer:p
      }
    }

    function generateZins() {
      const K = [100,200,500][randInt(0,2)];
      const p = [1,2,5][randInt(0,2)];
      return {
        type:'teil',
        label:'Kopf',
        text:`${p}% von ${K} €`,
        unit:'€',
        answer:round2(K*p/100)
      }
    }

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    document.getElementById('nextBtn').addEventListener('click', newTask);
    document.getElementById('purposeBtn').addEventListener('click', ()=>{
      const topic = topics[currentTopicIndex];
      purposeBox.className='purpose-box show';
      purposeBox.innerHTML = topic.purpose.points.join('<br>');
    });

    renderSidebar();
    newTask();
  </script>
</body>
</html>
