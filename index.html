<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prozent und Zinsen</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --soft: #f8fbff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d9e3f0;
      --accent: #2563eb;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --hint: #92400e;
      --hint-bg: #fef3c7;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }
    .hero {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .hero h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .panel h2 { margin-top: 0; }
    .topic-list { display: grid; gap: 10px; margin-bottom: 16px; }
    .topic-btn, .btn {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.12s ease;
    }
    .topic-btn:hover, .btn:hover { transform: translateY(-1px); }
    .topic-btn {
      text-align: left;
      padding: 13px 14px;
      background: #eef2ff;
      color: #1e3a8a;
    }
    .topic-btn.active { background: var(--accent); color: white; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--soft); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .stat-label { color: var(--muted); font-size: 0.9rem; margin-bottom: 4px; }
    .stat-value { font-size: 1.25rem; font-weight: 700; }
    .progress { height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #60a5fa); transition: width 0.3s ease; }
    .formula {
      background: #eef2ff;
      border-left: 4px solid #4f46e5;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    details summary { cursor: pointer; font-weight: 700; color: #1e3a8a; }
    details p { color: var(--muted); }
    .main-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .mode-switch { display: inline-flex; gap: 8px; background: #eff6ff; padding: 6px; border-radius: 14px; }
    .btn { padding: 11px 15px; background: var(--accent); color: white; }
    .btn.secondary { background: #e5edff; color: #1e3a8a; }
    .btn.ghost { background: #eef2f7; color: #334155; }
    .btn.active { outline: 3px solid #bfdbfe; }
    .exercise-card { background: var(--soft); border: 1px solid #dbeafe; border-radius: 22px; padding: 24px; }
    .task-meta { color: var(--muted); font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; }
    .task-type {
      margin-bottom: 12px;
      min-height: 26px;
      transform: scale(1.3);
      transform-origin: left center;
    }
    .task-text { font-size: clamp(1.15rem, 2.4vw, 1.5rem); font-weight: 700; margin-bottom: 22px; }
    .answer-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    input[type="number"] {
      width: min(280px, 100%);
      padding: 14px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      background: white;
    }
    .unit { color: var(--muted); font-weight: 700; font-size: 1rem; }
    .primary-actions, .helper-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .primary-actions { margin-bottom: 10px; }
    .feedback, .hint, .solution, .purpose-box {
      display: none;
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
    }
    .feedback.good { display: block; background: var(--ok-bg); color: var(--ok); }
    .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
    .hint.show, .solution.show { display: block; background: var(--hint-bg); color: var(--hint); }
    .purpose-box.show { display: block; background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; }
    .purpose-box ul { margin: 10px 0 0 20px; padding: 0; }
    .small-note { color: var(--muted); font-size: 0.95rem; margin-top: 14px; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .wrap { padding: 14px; }
      .exercise-card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Prozent und Zinsen</h1>
    </section>

    <div class="layout">
      <aside class="panel">
        <h2>Themen</h2>
        <div class="topic-list" id="topicButtons"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Punkte</div>
            <div class="stat-value" id="scoreBadge">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Serie</div>
            <div class="stat-value" id="streakBadge">0</div>
          </div>
        </div>

        <div class="stat" style="margin-bottom:12px;">
          <div class="stat-label">Thema</div>
          <div class="stat-value" id="levelBadge" style="font-size:1.05rem;">Prozentwert</div>
        </div>

        <div class="progress" aria-label="Lernfortschritt">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="formula" id="formulaBox"></div>

        <details>
          <summary>Um was geht es hier?</summary>
          <p id="topicSummary"></p>
        </details>
      </aside>

      <main class="panel">
        <div class="main-top">
          <h2 style="margin:0;">Aufgabe</h2>
          <div class="mode-switch">
            <button class="btn secondary active" id="normalModeBtn" type="button">Üben</button>
            <button class="btn secondary" id="testModeBtn" type="button">Test</button>
          </div>
        </div>

        <section class="exercise-card">
          <div id="taskType" class="task-type"></div>
          <div class="task-text" id="taskText">Lade Aufgabe …</div>

          <div class="answer-box">
            <input id="answerInput" type="number" step="0.01" placeholder="Antwort eingeben" />
            <div class="unit" id="unitLabel"></div>
          </div>

          <div class="primary-actions">
            <button class="btn" id="checkBtn" type="button">Prüfen</button>
            <button class="btn secondary" id="nextBtn" type="button">Weiter</button>
          </div>

          <div class="helper-actions">
            <button class="btn ghost" id="hintBtn" type="button">Hilfe</button>
            <button class="btn ghost" id="solutionBtn" type="button">Zeig Lösung</button>
            <button class="btn ghost" id="purposeBtn" type="button">Wozu brauche ich das?</button>
            <button class="btn ghost" id="resetBtn" type="button">Neu starten</button>
          </div>

          <div class="feedback" id="feedbackBox"></div>
          <div class="hint" id="hintBox"></div>
          <div class="solution" id="solutionBox"></div>
          <div class="purpose-box" id="purposeBox"></div>
        </section>

        <p class="small-note">🧩 W = Teil · 🟦 G = Ganzes · 📊 p = Prozent</p>
      </main>
    </div>
  </div>

  <script>
    const topics = [
      {
        key: 'prozentwert',
        title: '1. Prozentwert',
        short: 'Prozentwert',
        formula: 'W = G · p / 100',
        summary: 'Du suchst einen Teil von etwas.',
        purpose: ['Rabatte berechnen.', 'Anteile verstehen.', 'Teil von etwas berechnen.'],
        generator: generateProzentwert
      },
      {
        key: 'grundwert',
        title: '2. Grundwert',
        short: 'Grundwert',
        formula: 'G = W · 100 / p',
        summary: 'Du suchst das Ganze.',
        purpose: ['Alter Preis berechnen.', 'Gesamtzahl finden.', 'Vom Teil zurück rechnen.'],
        generator: generateGrundwert
      },
      {
        key: 'prozentsatz',
        title: '3. Prozentsatz',
        short: 'Prozent',
        formula: 'p = W / G · 100',
        summary: 'Du vergleichst Teil und Ganzes.',
        purpose: ['Vergleichen.', 'Preisänderungen verstehen.', 'Prozent lesen.'],
        generator: generateProzentsatz
      },
      {
        key: 'zins',
        title: '4. Zinsen',
        short: 'Zinsen',
        formula: 'Z = K · p / 100',
        summary: 'Geld wird mehr.',
        purpose: ['Sparen verstehen.', 'Kredite verstehen.', 'Geld wächst.'],
        generator: generateZins
      }
    ];

    let currentTopicIndex = 0;
    let currentTask = null;
    let score = 0;
    let streak = 0;
    let solvedInTopic = 0;
    let mode = 'practice';

    const topicButtons = document.getElementById('topicButtons');
    const levelBadge = document.getElementById('levelBadge');
    const scoreBadge = document.getElementById('scoreBadge');
    const streakBadge = document.getElementById('streakBadge');
    const progressBar = document.getElementById('progressBar');
    const formulaBox = document.getElementById('formulaBox');
    const topicSummary = document.getElementById('topicSummary');
    const taskText = document.getElementById('taskText');
    const taskType = document.getElementById('taskType');
    const unitLabel = document.getElementById('unitLabel');
    const answerInput = document.getElementById('answerInput');
    const feedbackBox = document.getElementById('feedbackBox');
    const hintBox = document.getElementById('hintBox');
    const solutionBox = document.getElementById('solutionBox');
    const purposeBox = document.getElementById('purposeBox');
    const normalModeBtn = document.getElementById('normalModeBtn');
    const testModeBtn = document.getElementById('testModeBtn');

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randChoice(list) {
      return list[randInt(0, list.length - 1)];
    }

    function round2(n) {
      return Math.round((n + Number.EPSILON) * 100) / 100;
    }

    function difficultyLevel() {
      if (solvedInTopic < 4) return 0;
      if (solvedInTopic < 8) return 1;
      return 2;
    }

    function renderType(type, value) {
      const gray = '#ffffff';
      const line = '#111827';
      const green = '#22c55e';
      const blue = '#3b82f6';

      if (type === 'teil' && typeof value === 'number') {
        const filled = Math.max(0, Math.min(100, Math.round(value)));
        const cells = Array.from({ length: 100 }, (_, i) =>
          `<div style="width:7px;height:7px;background:${i < filled ? green : gray};"></div>`
        ).join('');
        return `<div style="display:flex;align-items:center;gap:10px;">
          <div style="display:grid;grid-template-columns:repeat(10,7px);gap:1px;background:${line};padding:1px;border-radius:2px;">
            ${cells}
          </div>
          <span>🧩 W</span>
        </div>`;
      }

      if (type === 'prozent') {
        const cells = Array.from({ length: 9 }, () => `<div style="width:12px;height:12px;background:${gray};"></div>`).join('');
        return `<div style="display:flex;align-items:center;gap:10px;">
          <div style="display:grid;grid-template-columns:repeat(3,12px);gap:1px;background:${line};padding:1px;border-radius:2px;">
            ${cells}
          </div>
          <span>📊 p</span>
        </div>`;
      }

      const cells = Array.from({ length: 9 }, () => `<div style="width:12px;height:12px;background:${blue};"></div>`).join('');
      return `<div style="display:flex;align-items:center;gap:10px;">
        <div style="display:grid;grid-template-columns:repeat(3,12px);gap:1px;background:${line};padding:1px;border-radius:2px;">
          ${cells}
        </div>
        <span>🟦 G</span>
      </div>`;
    }

    function renderSidebar() {
      const topic = topics[currentTopicIndex];
      levelBadge.textContent = topic.short;
      scoreBadge.textContent = String(score);
      streakBadge.textContent = String(streak);
      formulaBox.textContent = topic.formula;
      topicSummary.textContent = topic.summary;
      progressBar.style.width = `${((currentTopicIndex + 1) / topics.length) * 100}%`;

      topicButtons.innerHTML = '';
      topics.forEach((topicItem, index) => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn' + (index === currentTopicIndex ? ' active' : '');
        btn.type = 'button';
        btn.textContent = topicItem.title;
        btn.addEventListener('click', () => {
          currentTopicIndex = index;
          solvedInTopic = 0;
          clearMessages();
          renderAll();
          newTask();
        });
        topicButtons.appendChild(btn);
      });
    }

    function clearMessages() {
      feedbackBox.className = 'feedback';
      feedbackBox.textContent = '';
      hintBox.className = 'hint';
      hintBox.textContent = '';
      solutionBox.className = 'solution';
      solutionBox.innerHTML = '';
      purposeBox.className = 'purpose-box';
      purposeBox.innerHTML = '';
    }

    function newTask() {
      clearMessages();
      currentTask = topics[currentTopicIndex].generator(difficultyLevel());
      taskType.innerHTML = renderType(currentTask.type, currentTask.percent ?? currentTask.visualValue ?? currentTask.answer);
      taskText.textContent = currentTask.text;
      unitLabel.textContent = currentTask.unit || '';
      answerInput.value = '';
      answerInput.focus();
    }

    function checkAnswer() {
      const raw = String(answerInput.value).replace(',', '.');
      const value = Number(raw);

      if (Number.isNaN(value)) {
        feedbackBox.className = 'feedback bad';
        feedbackBox.textContent = 'Bitte Zahl eingeben.';
        return;
      }

      if (Math.abs(value - currentTask.answer) < 0.01) {
        score += 1;
        streak += 1;
        solvedInTopic += 1;
        feedbackBox.className = 'feedback good';
        feedbackBox.textContent = 'Richtig 👍';
      } else {
        streak = 0;
        feedbackBox.className = 'feedback bad';
        feedbackBox.textContent = 'Noch einmal überlegen';
        if (mode === 'test') {
          solutionBox.className = 'solution show';
          solutionBox.innerHTML = `<strong>Richtig:</strong> ${currentTask.answer}${currentTask.unit ? ' ' + currentTask.unit : ''}`;
        }
      }

      renderSidebar();
    }

    function showHint() {
      if (!currentTask) return;
      hintBox.className = 'hint show';
      hintBox.textContent = mode === 'test' ? 'Denke an W, G oder p.' : currentTask.hint;
    }

    function showSolution() {
      if (!currentTask) return;
      solutionBox.className = 'solution show';
      solutionBox.innerHTML = currentTask.solution;
    }

    function showPurpose() {
      const topic = topics[currentTopicIndex];
      purposeBox.className = 'purpose-box show';
      purposeBox.innerHTML = `<strong>Wozu brauche ich das?</strong><ul>${topic.purpose.map((point) => `<li>${point}</li>`).join('')}</ul>`;
    }

    function resetAll() {
      currentTopicIndex = 0;
      score = 0;
      streak = 0;
      solvedInTopic = 0;
      clearMessages();
      renderAll();
      newTask();
    }

    function renderAll() {
      renderSidebar();
      normalModeBtn.classList.toggle('active', mode === 'practice');
      testModeBtn.classList.toggle('active', mode === 'test');
    }

    function generateProzentwert(level) {
      const contexts = ['', ' Schülern', ' €', ' Punkten'];
      const context = randChoice(contexts);
      if (level === 0) {
        const G = randChoice([20, 40, 50, 80, 100]);
        const p = randChoice([10, 25, 50]);
        const W = round2((G * p) / 100);
        return { type: 'teil', text: `${p} % von ${G}${context}`, unit: '', answer: W, percent: p, visualValue: W, hint: 'Teil von etwas suchen.', solution: `${G} · ${p} ÷ 100 = ${W}` };
      }
      if (level === 1) {
        const G = randInt(20, 200);
        const p = randChoice([5, 10, 20, 25, 50]);
        const W = round2((G * p) / 100);
        return { type: 'teil', text: `${p} % von ${G}${context}`, unit: '', answer: W, percent: p, visualValue: W, hint: 'Mit 100 teilen.', solution: `${G} · ${p} ÷ 100 = ${W}` };
      }
      const G = randInt(50, 300);
      const p = randInt(3, 40);
      const W = round2((G * p) / 100);
      return { type: 'teil', text: `Berechne ${p} % von ${G}${context}.`, unit: '', answer: W, visualValue: W, hint: 'W ist der Teil.', solution: `${G} · ${p} ÷ 100 = ${W}` };
    }

    function generateGrundwert(level) {
      if (level === 0) {
        const G = randChoice([40, 50, 80, 100]);
        const p = randChoice([10, 20, 25, 50]);
        const W = round2((G * p) / 100);
        return { type: 'ganz', text: `${W} sind ${p} % von ?`, unit: '', answer: G, hint: 'Das Ganze suchen.', solution: `${W} · 100 ÷ ${p} = ${G}` };
      }
      const p = randChoice([5, 10, 20, 25, 50]);
      const G = randInt(4, 30) * 10;
      const W = round2((G * p) / 100);
      return { type: 'ganz', text: `${W} sind ${p} % von ?`, unit: '', answer: G, hint: 'Auf 100 % hochrechnen.', solution: `${W} · 100 ÷ ${p} = ${G}` };
    }

    function generateProzentsatz(level) {
      if (level === 0) {
        const G = randChoice([40, 50, 80, 100]);
        const p = randChoice([10, 20, 25, 50]);
        const W = round2((G * p) / 100);
        return { type: 'prozent', text: `${W} von ${G} = ? %`, unit: '%', answer: p, hint: 'Teil mit Ganzem vergleichen.', solution: `${W} ÷ ${G} · 100 = ${p}` };
      }
      const G = randInt(40, 300);
      const p = randChoice([5, 10, 20, 25, 50, 75]);
      const W = round2((G * p) / 100);
      return { type: 'prozent', text: `${W} von ${G} sind wie viel %?`, unit: '%', answer: p, hint: 'Teil ÷ Ganzes · 100.', solution: `${W} ÷ ${G} · 100 = ${p}` };
    }

    function generateZins(level) {
      if (level === 0) {
        const K = randChoice([100, 200, 500]);
        const p = randChoice([1, 2, 5]);
        const Z = round2((K * p) / 100);
        return { type: 'teil', text: `${p} % von ${K} €`, unit: '€', answer: Z, percent: p, visualValue: Z, hint: 'Zinsen sind der Teil.', solution: `${K} · ${p} ÷ 100 = ${Z} €` };
      }
      const K = randInt(1, 20) * 100;
      const p = randChoice([1, 2, 3, 4, 5]);
      const Z = round2((K * p) / 100);
      return { type: 'teil', text: `${p} % Zinsen von ${K} €`, unit: '€', answer: Z, visualValue: Z, hint: 'Wie bei Prozentwert.', solution: `${K} · ${p} ÷ 100 = ${Z} €` };
    }

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    document.getElementById('nextBtn').addEventListener('click', newTask);
    document.getElementById('hintBtn').addEventListener('click', showHint);
    document.getElementById('solutionBtn').addEventListener('click', showSolution);
    document.getElementById('purposeBtn').addEventListener('click', showPurpose);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    normalModeBtn.addEventListener('click', () => { mode = 'practice'; renderAll(); });
    testModeBtn.addEventListener('click', () => { mode = 'test'; renderAll(); });
    answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });

    function startIntro() {
      const overlay = document.getElementById('introOverlay');
      const stage = document.getElementById('introStage');
      const text = document.getElementById('introText');
      const skipBtn = document.getElementById('skipIntro');
      const dontShow = document.getElementById('dontShowIntro');

      if (!overlay || !stage || !text || !skipBtn || !dontShow) return;
      if (localStorage.getItem('skipPercentIntro') === 'true') {
        overlay.style.display = 'none';
        return;
      }

      let timeouts = [];

      function closeIntro() {
        timeouts.forEach((id) => clearTimeout(id));
        overlay.style.display = 'none';
      }

      function quarterCells() {
        const topLeft = [];
        const threeQuarters = [];
        for (let r = 0; r < 10; r += 1) {
          for (let c = 0; c < 10; c += 1) {
            const i = r * 10 + c;
            if (r < 5 && c < 5) topLeft.push(i);
            if (!(r >= 5 && c >= 5)) threeQuarters.push(i);
          }
        }
        return { topLeft, threeQuarters };
      }

      const { topLeft, threeQuarters } = quarterCells();

      function renderIntroField(modeName) {
        let colored = [];
        if (modeName === 'p1') colored = [0];
        if (modeName === 'p10') colored = Array.from({ length: 10 }, (_, i) => i);
        if (modeName === 'p25-linear') colored = Array.from({ length: 25 }, (_, i) => i);
        if (modeName === 'p25-quarter') colored = topLeft;
        if (modeName === 'p50') colored = Array.from({ length: 50 }, (_, i) => i);
        if (modeName === 'p75-linear') colored = Array.from({ length: 75 }, (_, i) => i);
        if (modeName === 'p75-quarter') colored = threeQuarters;
        if (modeName === 'p100') colored = Array.from({ length: 100 }, (_, i) => i);
        if (modeName === 'teil') colored = [0];
        if (modeName === 'ganz') colored = Array.from({ length: 100 }, (_, i) => i);

        const showGrid = modeName !== 'field';
        const useGreen = modeName === 'teil';
        const color = useGreen ? '#22c55e' : '#3b82f6';
        const cells = Array.from({ length: 100 }, (_, i) => {
          const fill = colored.includes(i) ? color : 'rgba(255,255,255,0.25)';
          return `<div style="background:${fill};"></div>`;
        }).join('');

        stage.innerHTML = `
          <div style="position:relative;width:100%;height:100%;">
            <div style="position:absolute;inset:0;background:#16a34a;border-radius:6px;">
              <div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:white;"></div>
              <div style="position:absolute;left:50%;top:50%;width:40px;height:40px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);"></div>
            </div>
            ${showGrid ? `<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);gap:1px;">${cells}</div>` : ''}
          </div>`;
      }

      renderIntroField('field');
      text.textContent = '';

      const schedule = [
        [500, () => { text.textContent = 'Ganzes Feld'; renderIntroField('field'); }],
        [2200, () => { text.textContent = 'Wir teilen in 100 Teile'; renderIntroField('p0'); }],
        [3800, () => { text.textContent = '1 %'; renderIntroField('p1'); }],
        [5400, () => { text.textContent = '10 %'; renderIntroField('p10'); }],
        [7000, () => { text.textContent = '25 %'; renderIntroField('p25-linear'); }],
        [7600, () => { text.textContent = '25 % = 1/4'; renderIntroField('p25-quarter'); }],
        [8200, () => { text.textContent = '25 %'; renderIntroField('p25-linear'); }],
        [9000, () => { text.textContent = '50 %'; renderIntroField('p50'); }],
        [10600, () => { text.textContent = '75 %'; renderIntroField('p75-linear'); }],
        [11200, () => { text.textContent = '75 % = 3/4'; renderIntroField('p75-quarter'); }],
        [11800, () => { text.textContent = '75 %'; renderIntroField('p75-linear'); }],
        [12600, () => { text.textContent = '100 %'; renderIntroField('p100'); }],
        [14400, () => { text.textContent = '📊 Prozent gesucht'; renderIntroField('p0'); }],
        [15800, () => { text.textContent = '🧩 Teil gesucht'; renderIntroField('teil'); }],
        [17200, () => { text.textContent = '🟦 Ganzes gesucht'; renderIntroField('ganz'); }],
        [19000, () => closeIntro()]
      ];

      schedule.forEach(([delay, fn]) => {
        timeouts.push(setTimeout(fn, delay));
      });

      skipBtn.onclick = closeIntro;
      dontShow.onchange = (e) => {
        if (e.target.checked) localStorage.setItem('skipPercentIntro', 'true');
        else localStorage.removeItem('skipPercentIntro');
      };
    }

    renderAll();
    newTask();
    setTimeout(startIntro, 200);
  </script>


<div id="introOverlay" style="position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px;">
  <div id="introStage" style="width:260px;height:180px;position:relative;"></div>
  <div id="introText" style="font-weight:700;font-size:1.1rem;"></div>
  <div style="display:flex;gap:12px;align-items:center;">
    <button id="skipIntro" class="btn secondary">Überspringen</button>
    <label style="font-size:0.9rem;color:#64748b">
      <input type="checkbox" id="dontShowIntro"> Nicht mehr anzeigen
    </label>
  </div>
</div>

<script>
function runIntro(){

if(localStorage.getItem('skipPercentIntro')){
 document.getElementById('introOverlay').style.display='none';
 return;
}

const stage = document.getElementById('introStage');
const text = document.getElementById('introText');

function grid(count,color='#3b82f6',showGrid=true){
 stage.innerHTML=`
 <div style="position:relative;width:100%;height:100%;">
 
 <div style="position:absolute;inset:0;background:#16a34a;border-radius:6px;">
   <div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:white;"></div>
   <div style="position:absolute;left:50%;top:50%;width:40px;height:40px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);"></div>
 </div>
 
 ${showGrid ? `
 <div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);gap:1px;">
 ${Array(100).fill(0).map((_,i)=>`<div style="background:${i<count?color:'rgba(255,255,255,0.25)'}"></div>`).join('')}
 </div>
 ` : ''}
 
 </div>`
}

setTimeout(()=>{
 text.textContent='Ganzes Feld';
 grid(0,'#3b82f6',false);
},500);

setTimeout(()=>{
 text.textContent='Wir teilen in 100 Teile';
 grid(0,'#3b82f6',true);
},2200);

setTimeout(()=>{
 text.textContent='1 %';
 grid(1);
},3800);

setTimeout(()=>{
 text.textContent='10 %';
 grid(10);
},5400);

setTimeout(()=>{
 text.textContent='25 %';
 grid(25);
 setTimeout(()=>{ grid(25,'#3b82f6',true); },300);
 setTimeout(()=>{
   stage.innerHTML = stage.innerHTML.replace(/background:#3b82f6/g,'background:#22c55e');
 },600);
},7000);

setTimeout(()=>{
 text.textContent='50 %';
 grid(50);
},8600);

setTimeout(()=>{
 text.textContent='75 %';
 grid(75);
 setTimeout(()=>{ grid(75,'#3b82f6',true); },300);
 setTimeout(()=>{
   stage.innerHTML = stage.innerHTML.replace(/background:#3b82f6/g,'background:#22c55e');
 },600);
},10200);

setTimeout(()=>{
 text.textContent='100 %';
 grid(100);
},11800);

setTimeout(()=>{
 text.textContent='📊 Prozent gesucht';
 grid(0,'rgba(255,255,255,0.25)');
},13600);

setTimeout(()=>{
 text.textContent='🧩 Teil gesucht';
 grid(1,'#22c55e');
},15000);

setTimeout(()=>{
 text.textContent='🟦 Ganzes gesucht';
 grid(100,'#3b82f6');
},16400);

setTimeout(()=>{
 document.getElementById('introOverlay').style.opacity='0';
 setTimeout(()=>{
 document.getElementById('introOverlay').style.display='none';
 },400);
},18200);
}

setTimeout(()=>{ runIntro(); },200);

document.getElementById('skipIntro').onclick=()=>{
 document.getElementById('introOverlay').style.display='none';
}

document.getElementById('dontShowIntro').onchange=(e)=>{
 if(e.target.checked){
 localStorage.setItem('skipPercentIntro','true');
 }
}

</script>

</body>
</html>
